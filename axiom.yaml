name: hamiltonjlucas/formularium-engine
version: 0.3.0
language: python
description: 'Formularium discovery/analysis engines over the assembled physics catalog: validation, dimensional analysis, unit checks, relationship graph, structural analysis, curated symbolic derivation, numeric relation discovery, Buckingham-pi, and streaming exhaustive formula synthesis.'
license: Apache-2.0
nodes:
    - name: AssembleCatalog
      input: AssembleCatalogInput
      output: Catalog
    - name: ValidateCatalog
      input: Catalog
      output: ValidationReport
    - name: CheckDimensions
      input: Catalog
      output: DimensionsReport
    - name: CheckUnits
      input: Catalog
      output: UnitsReport
    - name: BuildGraph
      input: Catalog
      output: GraphReport
    - name: AnalyzeStructure
      input: Catalog
      output: StructureReport
    - name: DeriveRelations
      input: Catalog
      output: DeriveReport
    - name: DiscoverRelations
      input: Catalog
      output: DiscoverReport
    - name: Buckingham
      input: Catalog
      output: BuckinghamReport
    - name: SynthesizeRelations
      input: SynthesizeShardRequest
      output: SynthesizeEvent
      type: pipeline
    - name: AssembleSweepReport
      input: SweepReport
      output: SweepReport
imports:
    - package: hamiltonjlucas/formularium-types
      version: 0.3.0
      messages:
        - GraphReport
        - SynthesizeShardRequest
        - QuantitySpec
        - GraphEdge
        - BuckinghamGroup
        - BuckinghamSet
        - RelationCandidate
        - ValidationIssue
        - DerivationResult
        - SynthesizeEvent
        - ValidationReport
        - GraphNode
        - StructureReport
        - Catalog
        - DimensionCheck
        - DimensionsReport
        - DeriveReport
        - SynthesizedRelation
        - SweepReport
        - CentralityEntry
        - FormulaResult
        - UnitConversionCheck
        - DiscoverReport
        - Empty
        - ConstantSpec
        - UnitsReport
        - BuckinghamReport
        - FormulaSpec
        - DomainCatalog
        - SynthesisStats
