// Formularium engine — local messages. Leading comments become registry docs.

syntax = "proto3";

package hamiltonjlucas.formularium_engine;

import "hamiltonjlucas_formularium_constants_messages.proto";

// Fan-in input for AssembleCatalog: one field per Formularium source package,
// each filled by a plain per-edge adapter in the catalog-assemble flow.
message AssembleCatalogInput {
  // formularium-constants/GetCatalog output (constants filled, domains empty).
  hamiltonjlucas.formularium_constants.Catalog constants = 1;
  hamiltonjlucas.formularium_constants.DomainCatalog electroweak = 2;
  hamiltonjlucas.formularium_constants.DomainCatalog flavor = 3;
  hamiltonjlucas.formularium_constants.DomainCatalog bz_cascade = 4;
  hamiltonjlucas.formularium_constants.DomainCatalog atomic = 5;
  hamiltonjlucas.formularium_constants.DomainCatalog em_si = 6;
  hamiltonjlucas.formularium_constants.DomainCatalog gravity_thermo = 7;
  hamiltonjlucas.formularium_constants.DomainCatalog cosmology = 8;
  hamiltonjlucas.formularium_constants.DomainCatalog quantum_info = 9;
}
