// Formularium engine — local messages. Leading comments become registry docs.
// The catalog slices arrive as JSON strings (edge adapters use toJson(value)):
// embedding imported message types as fields trips the registry's per-package
// message uniqueness on push, so the fan-in shim is stringly-typed by design.
// The assembled OUTPUT is the fully-typed formularium-constants Catalog.

syntax = "proto3";

package hamiltonjlucas.formularium_engine;

// Fan-in input for AssembleCatalog: one JSON-encoded catalog slice per source
// package, each filled by a per-edge adapter (toJson(value)) in the
// catalog-assemble flow.
message AssembleCatalogInput {
  // formularium-constants/GetCatalog output (a Catalog JSON: constants filled).
  string constants_json = 1;
  // Each domain package's GetCatalog output (a DomainCatalog JSON).
  string electroweak_json = 2;
  string flavor_json = 3;
  string bz_cascade_json = 4;
  string atomic_json = 5;
  string em_si_json = 6;
  string gravity_thermo_json = 7;
  string cosmology_json = 8;
  string quantum_info_json = 9;
}
